<!doctype html>
<!-- 由 demo/tools/build.py 從正式版的 admin.html 產生，不要手改。 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- 內容安全政策:只執行這個網站自己的 script,不執行 HTML 裡的行內 script。後端網址(js/config.js 的 apiBase)換了主機時,connect-src 要一起改 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://router-backend-3hl2.onrender.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script src="storage-prefix.js"></script>
  <meta name="robots" content="noindex">
  <title>Admin console - mama-fufood</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../css/style.css">
  <style>body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }</style>
</head>
<body>
  <header class="top">
    <a href="index.html"><img src="../favicon.png" alt="Home"></a>
    <span class="title">Admin console</span>
    <span id="who" class="muted"></span>
    <button id="logout" hidden>Sign out</button>
  </header>
  <main>
    <div id="status" class="card" hidden><p id="status-msg" class="muted"></p></div>
    <div id="app" hidden>
      <div class="tabs" id="tabs">
        <button data-tab="data" class="active">Shared data</button>
        <button data-tab="version">App version</button>
        <button data-tab="feedback">Feedback</button>
        <button data-tab="admins">Admins</button>
        <button data-tab="audit">Activity log</button>
        <button data-tab="system">System</button>
      </div>
      <div id="msg"></div>
      <section id="tab-data"></section>
      <section id="tab-version" hidden></section>
      <section id="tab-feedback" hidden></section>
      <section id="tab-admins" hidden></section>
      <section id="tab-audit" hidden></section>
      <section id="tab-system" hidden></section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="fixtures.js"></script>
  <script src="api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
