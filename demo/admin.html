<!doctype html>
<!-- 由 demo/tools/build.py 從正式版的 admin.html 產生，不要手改。 -->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <!-- 內容安全政策:只執行這個網站自己的 script,不執行 HTML 裡的行內 script。後端網址(js/config.js 的 apiBase)換了主機時,connect-src 要一起改 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://router-backend-3hl2.onrender.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script src="storage-prefix.js"></script>
  <meta name="robots" content="noindex">
  <title>管理後台 - 媽媽記副食品</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="top">
    <a href="index.html"><img src="../favicon.png" alt="回首頁"></a>
    <span class="title">管理後台</span>
    <span id="who" class="muted"></span>
    <button id="logout" hidden>登出</button>
  </header>
  <main>
    <div id="status" class="card" hidden><p id="status-msg" class="muted"></p></div>
    <div id="app" hidden>
      <div class="tabs" id="tabs">
        <button data-tab="data" class="active">公用資料</button>
        <button data-tab="version">App 版本</button>
        <button data-tab="feedback">意見回饋</button>
        <button data-tab="admins">管理員</button>
        <button data-tab="system">系統</button>
      </div>
      <div id="msg"></div>
      <section id="tab-data"></section>
      <section id="tab-version" hidden></section>
      <section id="tab-feedback" hidden></section>
      <section id="tab-admins" hidden></section>
      <section id="tab-system" hidden></section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="fixtures.js"></script>
  <script src="api.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
